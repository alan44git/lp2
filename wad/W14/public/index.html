<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User List</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 18px;
      text-align: center;
    }

    .status {
      text-align: center;
      margin-bottom: 12px;
      color: #475569;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    li {
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
    }

    .name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .meta {
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>User Directory</h1>
    <p id="status" class="status">Loading users...</p>
    <ul id="userList"></ul>
  </div>

  <script>
    async function loadUsers() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('userList');

      try {
        const response = await fetch('/api/users');
        if (!response.ok) {
          throw new Error('Failed to fetch users.');
        }

        const users = await response.json();
        listEl.innerHTML = '';

        if (!Array.isArray(users) || users.length === 0) {
          statusEl.textContent = 'No users found.';
          return;
        }

        users.forEach((user) => {
          const item = document.createElement('li');
          item.innerHTML = `
            <div class="name">${user.name}</div>
            <div class="meta">Email: ${user.email}</div>
            <div class="meta">City: ${user.city}</div>
          `;
          listEl.appendChild(item);
        });

        statusEl.textContent = `Loaded ${users.length} users.`;
      } catch (error) {
        statusEl.textContent = 'Unable to load users at the moment.';
      }
    }

    loadUsers();
  </script>
</body>
</html>
