<!DOCTYPE html>
<html>
<head>
    <title>To-Do AJAX</title>
    <style>
        body { font-family: Arial; text-align: center; }
        input { padding: 5px; }
        button { margin-left: 5px; }
        ul {
            list-style-type: none;   /* remove bullets */
            padding: 0;              /* remove left spacing */
        }

        li {
            text-align: center; 
            margin: 10px;     /* keep content centered */
        }
    </style>
</head>
<body>

<h2>To-Do List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<script>
const BASE_URL = "http://localhost:3000/tasks";

function loadTasks() {
    fetch(BASE_URL)
        .then(res => res.json())
        .then(data => {
            let html = "";

            data.forEach(t => {
                html += `
                <li>
                    <span id="text-${t.id}">${t.text}</span>

                    <input type="text" id="edit-${t.id}" style="display:none;" />

                    <button onclick="startEdit(${t.id})">Edit</button>
                    <button onclick="saveEdit(${t.id})" style="display:none;" id="save-${t.id}">Save</button>

                    <button onclick="deleteTask(${t.id})">Delete</button>
                </li>`;
            });

            document.getElementById("taskList").innerHTML = html;
        });
}

function addTask() {
    let input = document.getElementById("taskInput");
    let text = input.value.trim();

    if (!text) return;

    fetch(BASE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
    })
    .then(() => {
        input.value = ""; // ✅ clear textbox
        loadTasks();
    });
}

function deleteTask(id) {
    fetch(`${BASE_URL}/${id}`, { method: "DELETE" })
        .then(loadTasks);
}

function startEdit(id) {
    let textSpan = document.getElementById(`text-${id}`);
    let editBox = document.getElementById(`edit-${id}`);
    let saveBtn = document.getElementById(`save-${id}`);

    editBox.value = textSpan.innerText;

    textSpan.style.display = "none";
    editBox.style.display = "inline";
    saveBtn.style.display = "inline";
}

function saveEdit(id) {
    let editBox = document.getElementById(`edit-${id}`);
    let newText = editBox.value.trim();

    if (!newText) return;

    fetch(`${BASE_URL}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: newText })
    }).then(loadTasks);
}

window.onload = loadTasks;
</script>

</body>
</html>
